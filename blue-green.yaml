# 1. DEPLOYMENT BLUE (Entorno V1 en ejecución)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techmarket-orders-blue
  labels:
    app: techmarket-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techmarket-orders
      version: blue
  template:
    metadata:
      labels:
        app: techmarket-orders
        version: blue
    spec:
      containers:
      - name: orders-container
        image: nginx:1.25
        ports:
        - containerPort: 3000
        imagePullPolicy: Always

---
# 2. SERVICE - El "Puntero" que el pipeline manipula de forma inmediata
apiVersion: v1
kind: Service
metadata:
  name: techmarket-orders-bg-service
  labels:
    app: techmarket-orders
spec:
  type: LoadBalancer 
  selector:
    app: techmarket-orders
    version: blue # El pipeline altera este tag a 'green' con un kubectl patch
  ports:
    - protocol: TCP
      port: 80          
      targetPort: 3000

---
# 3. DEPLOYMENT GREEN (Entorno V2 aislado para pruebas de humo)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techmarket-orders-green
  labels:
    app: techmarket-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techmarket-orders
      version: green
  template:
    metadata:
      labels:
        app: techmarket-orders
        version: green
    spec:
      containers:
      - name: orders-container
        image: nginx:latest
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
