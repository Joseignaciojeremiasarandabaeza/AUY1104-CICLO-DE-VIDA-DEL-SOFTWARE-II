### 1. SERVICE - Expone la Aplicación
apiVersion: v1
kind: Service
metadata:
  name: duoc-app-canary-service
  labels:
    app: duoc-app
spec:
  # Apunta a cualquier pod con 'app: duoc-app', sin importar la versión
  selector:
    app: duoc-app 
  type: LoadBalancer 
  ports:
    - protocol: TCP
      port: 80          
      targetPort: 3000

---
### 2. DEPLOYMENT - Versión Estable (v1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duoc-app-stable-v1
  labels:
    app: duoc-app
spec:
  replicas: 2 # Representa la mayoría del tráfico inicial
  selector:
    matchLabels:
      app: duoc-app
      version: stable
  template:
    metadata:
      labels:
        app: duoc-app
        version: stable
    spec:
      containers:
      - name: node-app-container
        image: nginx:1.25 # Imagen estable real
        ports:
        - containerPort: 3000
        imagePullPolicy: Always

---
### 3. DEPLOYMENT - Versión Canary (v2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duoc-app-canary-v2
  labels:
    app: duoc-app
spec:
  replicas: 1 # Recibe una pequeña porción del tráfico
  selector:
    matchLabels:
      app: duoc-app
      version: canary
  template:
    metadata:
      labels:
        app: duoc-app
        version: canary
    spec:
      containers:
      - name: node-app-container
        image: nginx:latest # Imagen nueva (Canary) real
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
