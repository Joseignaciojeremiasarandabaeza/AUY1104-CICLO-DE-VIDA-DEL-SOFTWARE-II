apiVersion: apps/v1
kind: Deployment
metadata:
  name: techmarket-orders-rolling
  labels:
    app: techmarket-orders
spec:
  replicas: 3
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Permite levantar 1 pod extra sobre el límite durante el deploy
      maxUnavailable: 0 # Garantiza que ningún pod se apague hasta que el nuevo esté listo
  selector:
    matchLabels:
      app: techmarket-orders
  template:
    metadata:
      labels:
        app: techmarket-orders
    spec:
      containers:
      - name: orders-container
        image: nginx:latest  # Simulación de la V2 del servicio de órdenes
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: techmarket-orders-service
  labels:
    app: techmarket-orders
spec:
  type: LoadBalancer 
  selector:
    app: techmarket-orders
  ports:
    - protocol: TCP
      port: 80          
      targetPort: 3000
