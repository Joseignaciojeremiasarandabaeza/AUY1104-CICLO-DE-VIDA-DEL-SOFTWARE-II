apiVersion: apps/v1
kind: Deployment
metadata:
  name: duoc-app-rolling  # <--- Este es el nombre que buscará el pipeline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: duoc-app
  template:
    metadata:
      labels:
        app: duoc-app
    spec:
      containers:
      - name: node-app-container
        image: ${{ env.ECR_URI_V1 }} # Asegúrate que esta variable se resuelva o cámbiala por tu imagen real
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
  strategy: 
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: duoc-app-service
spec:
  selector:
    app: duoc-app
  type: LoadBalancer 
  ports:
    - protocol: TCP
      port: 80         
      targetPort: 3000
