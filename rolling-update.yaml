apiVersion: apps/v1
kind: Deployment
metadata:
  name: duoc-app-rolling
spec:
  replicas: 3
  selector:
    matchLabels:
      app: duoc-app
  template:
    metadata:
      labels:
        app: duoc-app
    spec:
      containers:
      - name: node-app-container
        image: nginx:latest  # Se eliminó la variable $ECR_URI_V1
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
  strategy: 
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: duoc-app-service
spec:
  selector:
    app: duoc-app
  type: LoadBalancer 
  ports:
    - protocol: TCP
      port: 80          
      targetPort: 3000
