apiVersion: apps/v1
kind: Deployment
metadata:
  name: techmarket-orders-recreate
  labels:
    app: techmarket-orders
spec:
  replicas: 3
  strategy: 
    type: Recreate # Elimina de golpe la V1 antes de levantar la V2 (Genera Downtime)
  selector:
    matchLabels:
      app: techmarket-orders
  template:
    metadata:
      labels:
        app: techmarket-orders
    spec:
      containers:
      - name: orders-container
        image: nginx:latest
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: techmarket-orders-recreate-service
  labels:
    app: techmarket-orders
spec:
  type: LoadBalancer 
  selector:
    app: techmarket-orders
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
