name: Despliegue EKS - Estrategias de Rollout

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Estrategia (rolling-update, recreate, blue-green, canary)'
        required: true
        type: choice
        options:
          - rolling-update
          - recreate
          - blue-green
          - canary
        default: 'rolling-update'

env:
  # Configuración del Clúster basada en tu captura
  EKS_CLUSTER_NAME: 'duoc-eks-cluster-cli'
  AWS_REGION: 'us-east-1'
  # Rutas de tus archivos YAML
  YAML_ROLLING: 'k8s/rolling-update.yaml'
  YAML_RECREATE: 'k8s/recreate.yaml'
  YAML_GREEN: 'k8s/blue-green-green.yaml'
  YAML_CANARY: 'k8s/canary-v2.yaml'

jobs:
  deploy-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar acceso a EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          echo "Verificando conexión..."
          kubectl get nodes

      # 🔄 ESTRATEGIA: ROLLING UPDATE
      - name: 🔄 Ejecutar Rolling Update
        if: ${{ github.event.inputs.strategy == 'rolling-update' || github.event_name == 'push' }}
        run: |
          kubectl apply -f ${{ env.YAML_ROLLING }}
          kubectl rollout status deployment/duoc-app-rolling --timeout=300s

      # ❌ ESTRATEGIA: RECREATE
      - name: ❌ Ejecutar Recreate
        if: ${{ github.event.inputs.strategy == 'recreate' }}
        run: |
          kubectl apply -f ${{ env.YAML_RECREATE }}
          kubectl rollout status deployment/duoc-app-recreate --timeout=300s

      # 🟦 ESTRATEGIA: BLUE/GREEN
      - name: 🟦 Ejecutar Blue/Green
        if: ${{ github.event.inputs.strategy == 'blue-green' }}
        run: |
          kubectl apply -f ${{ env.YAML_GREEN }}
          kubectl rollout status deployment/duoc-app-green --timeout=300s
          echo "Esperando validación de entorno Green..."
          sleep 30
          kubectl patch service duoc-app-bg-service -p '{"spec": {"selector": {"version": "green"}}}'

      # 🐥 ESTRATEGIA: CANARY
      - name: 🐥 Ejecutar Canary
        if: ${{ github.event.inputs.strategy == 'canary' }}
        run: |
          kubectl apply -f ${{ env.YAML_CANARY }}
          kubectl rollout status deployment/duoc-app-canary-v2 --timeout=300s
          echo "Canary desplegado al 10%. Validando..."
          sleep 30
          kubectl scale deployment/duoc-app-canary-v2 --replicas=3
          kubectl scale deployment/duoc-app-stable-v1 --replicas=0
