name: Despliegue EKS - Estrategias de Rollout

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Estrategia a Ejecutar (rolling-update, recreate, blue-green, o canary)'
        required: true
        type: string
        default: 'rolling-update'
      eks_cluster_name:
        description: 'Nombre del Cluster EKS'
        required: true
        default: 'duoc-eks-cluster-cli'
      aws_region:
        description: 'Región de AWS'
        required: true
        default: 'us-east-1'

jobs:
  deploy-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: read 

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Configurar Kubectl para EKS (Usando AWS CLI)
        run: |
          aws eks update-kubeconfig --name ${{ github.event.inputs.eks_cluster_name }} --region ${{ github.event.inputs.aws_region }}
      
      # 1. ROLLING UPDATE
      - name: 🔄 Ejecutar Rolling Update
        if: ${{ github.event.inputs.strategy == 'rolling-update' }}
        run: |
          echo "Aplicando YAML para Rolling Update..."
          kubectl apply -f k8s/rolling-update.yaml
          kubectl rollout status deployment/duoc-app-rolling --timeout=300s

      # 2. RECREATE
      - name: ❌ Ejecutar Recreate
        if: ${{ github.event.inputs.strategy == 'recreate' }}
        run: |
          echo "Aplicando YAML para Recreate..."
          kubectl apply -f k8s/recreate.yaml
          kubectl rollout status deployment/duoc-app-recreate --timeout=300s
          
      # 3. BLUE/GREEN
      - name: 🟦 Ejecutar Blue/Green
        if: ${{ github.event.inputs.strategy == 'blue-green' }}
        run: |
          DEPLOYMENT_GREEN_NAME="duoc-app-green"
          SERVICE_NAME="duoc-app-bg-service"
          YAML_FILE_GREEN="k8s/blue-green-green.yaml"
          
          echo "1. Desplegando el entorno GREEN (Inactivo)..."
          kubectl apply -f $YAML_FILE_GREEN
          kubectl rollout status deployment/$DEPLOYMENT_GREEN_NAME --timeout=300s
          
          echo "2. Ventana de Prueba (120 segundos)..."
          sleep 120
          
          echo "3. Ejecutando Switch: BLUE -> GREEN..."
          kubectl patch service $SERVICE_NAME -p "{\"spec\": {\"selector\": {\"version\": \"green\"}}}"

      # 4. CANARY
      - name: 🐥 Ejecutar Canary
        if: ${{ github.event.inputs.strategy == 'canary' }}
        run: |
          DEPLOYMENT_CANARY_NAME="duoc-app-canary-v2"
          STABLE_DEPLOYMENT_NAME="duoc-app-stable-v1"
          YAML_FILE_CANARY="k8s/canary-v2.yaml"
          TOTAL_REPLICAS=3
          
          echo "1. Desplegando CANARY (10% de tráfico)..."
          kubectl apply -f $YAML_FILE_CANARY
          kubectl rollout status deployment/$DEPLOYMENT_CANARY_NAME --timeout=300s
          
          echo "2. Ventana de Observación (120 segundos)..."
          sleep 120
          
          echo "3. PROMOCIÓN: Escalar V2 y apagar V1..."
          kubectl scale deployment/$DEPLOYMENT_CANARY_NAME --replicas=$TOTAL_REPLICAS
          kubectl scale deployment/$STABLE_DEPLOYMENT_NAME --replicas=0
          
          kubectl rollout status deployment/$DEPLOYMENT_CANARY_NAME --timeout=300s
