name: Despliegue EKS - Estrategias de Rollout

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Estrategia (rolling-update, recreate, blue-green, canary)'
        required: true
        type: choice
        options:
          - rolling-update
          - recreate
          - blue-green
          - canary
        default: 'rolling-update'
      eks_cluster_name:
        description: 'Nombre del Cluster EKS'
        required: true
        default: 'duoc-eks-cluster-cli'
      aws_region:
        description: 'Región de AWS'
        required: true
        default: 'us-east-1'

jobs:
  deploy-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ github.event.inputs.aws_region || 'us-east-1' }}

      - name: Configurar acceso a EKS (kubeconfig)
        run: |
          aws eks update-kubeconfig --name ${{ github.event.inputs.eks_cluster_name || 'duoc-eks-cluster-cli' }} --region ${{ github.event.inputs.aws_region || 'us-east-1' }}

      # -----------------------------------------------------------
      # 1. 🔄 ROLLING UPDATE
      # -----------------------------------------------------------
      - name: 🔄 Ejecutar Rolling Update
        if: ${{ github.event.inputs.strategy == 'rolling-update' || github.event_name == 'push' }}
        run: |
          kubectl apply -f rolling-update.yaml
          kubectl rollout status deployment/duoc-app-rolling --timeout=300s || (kubectl get pods && kubectl describe pods && exit 1)

      # -----------------------------------------------------------
      # 2. ❌ RECREATE
      # -----------------------------------------------------------
      - name: ❌ Ejecutar Recreate
        if: ${{ github.event.inputs.strategy == 'recreate' }}
        run: |
          kubectl apply -f all-in-once.yaml
          kubectl rollout status deployment/duoc-app-recreate --timeout=300s

      # -----------------------------------------------------------
      # 3. 🟦 BLUE/GREEN
      # -----------------------------------------------------------
      - name: 🟦 Ejecutar Blue/Green
        if: ${{ github.event.inputs.strategy == 'blue-green' }}
        run: |
          DEPLOYMENT_GREEN_NAME="duoc-app-green"
          SERVICE_NAME="duoc-app-bg-service"
          
          kubectl apply -f blue-green.yaml
          kubectl rollout status deployment/$DEPLOYMENT_GREEN_NAME --timeout=300s
          
          echo "Ventana de observación (30 seg)..."
          sleep 30
          
          kubectl patch service $SERVICE_NAME -p '{"spec": {"selector": {"version": "green"}}}'

      # -----------------------------------------------------------
      # 4. 🐥 CANARY
      # -----------------------------------------------------------
      - name: 🐥 Ejecutar Canary
        if: ${{ github.event.inputs.strategy == 'canary' }}
        run: |
          DEPLOYMENT_CANARY_NAME="duoc-app-canary-v2"
          STABLE_DEPLOYMENT_NAME="duoc-app-stable-v1"
          
          kubectl apply -f canary.yaml
          kubectl rollout status deployment/$DEPLOYMENT_CANARY_NAME --timeout=300s
          
          sleep 30
          
          kubectl scale deployment/$DEPLOYMENT_CANARY_NAME --replicas=3
          kubectl scale deployment/$STABLE_DEPLOYMENT_NAME --replicas=0
