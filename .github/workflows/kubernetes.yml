name: Despliegue EKS - Estrategias de Rollout

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Estrategia a Ejecutar (rolling-update, recreate, blue-green, canary)'
        required: true
        type: choice
        options:
          - rolling-update
          - recreate
          - blue-green
          - canary
        default: 'rolling-update'
      eks_cluster_name:
        description: 'Nombre del Cluster EKS'
        required: true
        default: 'duoc-eks-cluster-cli'
      aws_region:
        description: 'Región de AWS'
        required: true
        default: 'us-west-2'

env:
  # Define aquí las rutas reales de tus archivos en el repo
  YAML_ROLLING: 'k8s/rolling-update.yaml'
  YAML_RECREATE: 'k8s/recreate.yaml'
  YAML_GREEN: 'k8s/blue-green-green.yaml'
  YAML_CANARY: 'k8s/canary-v2.yaml'

jobs:
  deploy-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: read 
    
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Configurar Kubectl para EKS
        uses: aws-actions/eks-set-context@v4
        with:
          cluster-name: ${{ github.event.inputs.eks_cluster_name }}
          aws-region: ${{ github.event.inputs.aws_region }}
      
      # -----------------------------------------------------------
      # 2.1. 🔄 ROLLING UPDATE
      # -----------------------------------------------------------
      - name: 🔄 Ejecutar Rolling Update
        if: ${{ github.event.inputs.strategy == 'rolling-update' }}
        run: |
          kubectl apply -f ${{ env.YAML_ROLLING }}
          kubectl rollout status deployment/duoc-app-rolling --timeout=300s

      # -----------------------------------------------------------
      # 2.2. ❌ RECREATE
      # -----------------------------------------------------------
      - name: ❌ Ejecutar Recreate
        if: ${{ github.event.inputs.strategy == 'recreate' }}
        run: |
          kubectl apply -f ${{ env.YAML_RECREATE }}
          kubectl rollout status deployment/duoc-app-recreate --timeout=300s
          
      # -----------------------------------------------------------
      # 2.3. 🟦 BLUE/GREEN
      # -----------------------------------------------------------
      - name: 🟦 Ejecutar Blue/Green
        if: ${{ github.event.inputs.strategy == 'blue-green' }}
        run: |
          # Aquí usamos variables de SHELL (sin ${{ }}) para nombres internos
          DEPLOYMENT_GREEN="duoc-app-green"
          SERVICE_NAME="duoc-app-bg-service"
          
          echo "Desplegando entorno GREEN..."
          kubectl apply -f ${{ env.YAML_GREEN }}
          kubectl rollout status deployment/$DEPLOYMENT_GREEN --timeout=300s
          
          echo "Esperando validación..."
          sleep 120
          
          echo "Cambiando tráfico a GREEN..."
          kubectl patch service $SERVICE_NAME -p '{"spec": {"selector": {"version": "green"}}}'
          
      # -----------------------------------------------------------
      # 2.4. 🐥 CANARY
      # -----------------------------------------------------------
      - name: 🐥 Ejecutar Canary
        if: ${{ github.event.inputs.strategy == 'canary' }}
        run: |
          CANARY_NAME="duoc-app-canary-v2"
          STABLE_NAME="duoc-app-stable-v1"
          
          echo "Desplegando versión Canary..."
          kubectl apply -f ${{ env.YAML_CANARY }}
          kubectl rollout status deployment/$CANARY_NAME --timeout=300s
          
          sleep 120
          
          echo "Promocionando Canary a producción..."
          kubectl scale deployment/$CANARY_NAME --replicas=3
          kubectl scale deployment/$STABLE_NAME --replicas=0
